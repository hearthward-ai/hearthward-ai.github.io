<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta property="og:type" content="website">
<meta property="og:title" content="Hearthward 煦坞">
<meta property="og:description" content="A free, private AI assistant being built to run at home on a local model, with a guard designed to stop outside text from taking control.">
<meta property="og:url" content="https://hearthward-ai.github.io/">
<meta property="og:image" content="https://hearthward-ai.github.io/brand/hearthward-lockup-bilingual-light-2x.png">
<meta property="og:image:alt" content="Hearthward 煦坞 logo">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F6E9D8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#241A15" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
:root{--bg:#F6E9D8;--ink:#3B2A22;--flame:#E8743B;--gold:#F2B544;--link:#B4491A;--zh:#C4561F}
@media (prefers-color-scheme:dark){:root{--bg:#241A15;--ink:#F6E9D8;--link:#F2B544;--zh:#E8743B}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;background:var(--bg);color:var(--ink);font:1.125rem/1.6 Georgia,"Times New Roman",serif}
main{max-width:34rem;text-align:center}
.mark{width:clamp(96px,28vw,140px);height:auto;display:block;margin:0 auto 1.25rem}
h1{margin:0;font:600 clamp(2.4rem,9vw,3.4rem)/1.1 Bitter,Georgia,serif;letter-spacing:.01em}
.zh{margin:.35rem 0 1.5rem;font:clamp(1.3rem,5vw,1.8rem)/1.2 "ZCOOL QingKe HuangYou","Noto Sans SC",sans-serif;letter-spacing:.35em;padding-left:.35em;color:var(--zh)}
p{margin:0 0 1.1rem}
.status{display:inline-block;margin-top:.4rem;padding:.35rem .9rem;border:1px solid var(--gold);border-radius:999px;font-size:1rem}
a{color:var(--link);text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--flame);outline-offset:3px}
footer{margin-top:2rem;font-size:.85rem;opacity:.75}
</style>
</head>
<body>
<main>
<img class="mark" src="favicon.svg" alt="Hearthward logo: a doorway of bricks with a small flame inside" width="140" height="140">
<h1>Hearthward</h1>
<div class="zh" lang="zh-Hans">煦坞</div>
<p>A free, private AI assistant being built to run at home on a local model, with a guard designed to stop outside text from taking control.</p>
<p class="status">Early stage. Code and docs are on the way.</p>
<p><a href="https://github.com/hearthward-ai">github.com/hearthward-ai</a></p>
<footer>Hearthward, 煦坞 and the Hearthward logo are trademarks of TonyC115.</footer>
</main>
</body>
